version: '3.8'

services:
  dolt:
    image: dolthub/dolt-sql-server:latest
    container_name: truth_engine_dolt
    ports:
      - "3306:3306"
    environment:
      - DOLT_ROOT_PATH=/var/lib/dolt
      - MYSQL_ROOT_PASSWORD=password
    volumes:
      - dolt_data:/var/lib/dolt
    command:
      - -l
      - debug
    healthcheck:
      test: ["CMD", "dolt", "version"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    container_name: truth_engine_chromadb
    ports:
      - "8000:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dolt_data:
  chromadb_data:
