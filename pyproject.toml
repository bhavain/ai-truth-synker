[tool.poetry]
name = "truth-engine"
version = "0.1.0"
description = "Evercurrent Hardware Synchronization AI - Truth Engine MVP"
authors = ["Evercurrent Team"]
readme = "README.md"
packages = [{include = "app", from = "backend"}]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
langchain = "^1.1.3"
langchain-openai = "^1.1.2"
langchain-community = "^0.4.1"
langgraph = "^1.0.4"
langsmith = "^0.4.59"
chromadb = "^1.3.6"
mysql-connector-python = "^9.1.0"
pymysql = "^1.1.1"
sqlalchemy = "^2.0.36"
python-dotenv = "^1.0.1"
httpx = "^0.28.0"
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
langgraph-cli = {extras = ["inmem"], version = "^0.4.9"}
streamlit = "^1.39.0"
plotly = "^5.24.0"
networkx = "^3.4.0"
pandas = "^2.2.0"

[tool.poetry.group.dev.dependencies]
black = "^24.10.0"
ruff = "^0.7.4"
mypy = "^1.13.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py313']

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
